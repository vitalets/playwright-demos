name: Worker timeline - 2 shards
on:
  workflow_dispatch:
  push:
    paths:
      - 'github-summary-report/**'
      - '.github/workflows/github-summary-sharded.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: github-summary-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-summary-report/package-lock.json
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: timeline-shard-${{ matrix.shard }}
          path: github-summary-report/test-results/timeline/shard-*.json
          if-no-files-found: error
  summary:
    name: Combined worker timeline
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: timeline-shard-*
          merge-multiple: true
          path: github-summary-report/test-results/timeline
      - run: node merge.mjs test-results/timeline 2
        working-directory: github-summary-report
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-data
          path: github-summary-report/test-results/timeline/
