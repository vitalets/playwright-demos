<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playwright Demos</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, #dbeafe 0, transparent 32rem),
          radial-gradient(circle at bottom right, #dcfce7 0, transparent 28rem),
          #f8fafc;
        color: #0f172a;
      }

      main {
        max-width: 40rem;
        margin: 2rem;
        padding: 2rem;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 1.125rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(circle at top left, rgba(59, 130, 246, 0.24) 0, transparent 32rem),
            radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18) 0, transparent 28rem),
            #020617;
          color: #e2e8f0;
        }

        main {
          border-color: rgba(226, 232, 240, 0.14);
          background: rgba(15, 23, 42, 0.82);
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Playwright Demos</h1>
      <p>Demos and generated reports for different Playwright experiments.</p>
    </main>
  </body>
</html>
